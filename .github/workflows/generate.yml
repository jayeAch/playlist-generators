name: Adult Swim + Vidaa + Samsung M3U + EPG

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      skip_epg:
        description: "Skip EPG generation (M3U only)"
        type: boolean
        default: false
      force:
        description: "Force rebuild even if outputs are < 6 h old"
        type: boolean
        default: false

concurrency:
  group: m3u-epg
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

name: Adult Swim + Vidaa + Cineverse M3U + EPG

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      skip_epg:
        description: "Skip EPG generation (M3U only)"
        type: boolean
        default: false

concurrency:
  group: m3u-epg
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Vidaa DRM cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vidaa_m3u_epg
          key: vidaa-drm-${{ github.run_id }}
          restore-keys: vidaa-drm-

      - name: Prepare output directory
        run: mkdir -p playlists

      - name: Run Adult Swim scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event.inputs.skip_epg }}" = "true" ]; then
            EXTRA="--no-epg"
          else
            EXTRA=""
          fi
          python adultswim.py \
            --out-dir playlists \
            --m3u adultswim.m3u \
            --epg adultswim.xml \
            --workers 8 \
            -v \
            $EXTRA

      - name: Run Vidaa scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event.inputs.skip_epg }}" = "true" ]; then
            EXTRA="--no-epg"
          else
            EXTRA=""
          fi
          python vidaa.py \
            --out-dir playlists \
            --m3u vidaa.m3u \
            --epg vidaa.xml \
            -v \
            $EXTRA

      - name: Run Cineverse scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event.inputs.skip_epg }}" = "true" ]; then
            EXTRA="--no-epg"
          else
            EXTRA=""
          fi
          python cineverse.py \
            --out-dir playlists \
            --m3u cineverse.m3u \
            --epg cineverse.xml \
            -v \
            $EXTRA

      - name: Sanity-check outputs
        run: |
          for f in playlists/adultswim.m3u playlists/vidaa.m3u playlists/cineverse.m3u; do
            test -s "$f" || { echo "::error::$f is empty or missing"; exit 1; }
            head -n 1 "$f" | grep -q '^#EXTM3U' \
              || { echo "::error::$f is not a valid M3U"; exit 1; }
          done
          for f in playlists/adultswim.xml playlists/vidaa.xml playlists/cineverse.xml; do
            if [ -f "$f" ]; then
              python - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          path = sys.argv[1]
          try:
              tree = ET.parse(path)
          except Exception as exc:
              print(f"::error::{path} failed to parse: {exc}")
              sys.exit(1)
          root = tree.getroot()
          print(f"{path}: {len(root.findall('channel'))} channels, "
                f"{len(root.findall('programme'))} programmes")
          PY
            fi
          done

      - name: Show summary
        run: |
          echo "### Refresh summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source | Channels | M3U bytes | EPG bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for src in adultswim vidaa cineverse; do
            ch=$(grep -c '^#EXTINF' "playlists/$src.m3u" 2>/dev/null || echo 0)
            m3u=$(wc -c < "playlists/$src.m3u" 2>/dev/null || echo 0)
            epg=$([ -f "playlists/$src.xml" ] && wc -c < "playlists/$src.xml" || echo 0)
            echo "| $src | \`$ch\` | \`$m3u\` | \`$epg\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Commit updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlists/adultswim.m3u playlists/adultswim.xml \
                  playlists/vidaa.m3u playlists/vidaa.xml \
                  playlists/cineverse.m3u playlists/cineverse.xml 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh M3U + EPG [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            echo "Push attempt $i failed, retrying…"
            sleep 5
          done
